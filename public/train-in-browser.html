<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lullaby Training Interface</title>
  <style>
    body {
      background-color: #0a0a0f;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 800px;
      width: 100%;
      background: #111827;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }
    h1 {
      color: #fbbf24;
      margin-top: 0;
      border-bottom: 1px solid #334155;
      padding-bottom: 1rem;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      color: #94a3b8;
      font-weight: 500;
    }
    select, input {
      width: 100%;
      padding: 0.75rem;
      background: #1e293b;
      border: 1px solid #475569;
      color: white;
      border-radius: 6px;
      font-size: 1rem;
    }
    select:focus, input:focus {
      outline: none;
      border-color: #fbbf24;
    }
    .btn {
      background: #fbbf24;
      color: #000;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #f59e0b;
    }
    .btn:disabled {
      background: #475569;
      color: #94a3b8;
      cursor: not-allowed;
    }
    .log {
      margin-top: 2rem;
      background: #000;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 1rem;
      height: 250px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.875rem;
    }
    .log-entry { margin-bottom: 0.25rem; }
    .log-entry.info { color: #94a3b8; }
    .log-entry.success { color: #4ade80; }
    .log-entry.error { color: #f87171; }
    .log-entry.warn { color: #fbbf24; }
    .progress-bar {
      width: 100%;
      height: 24px;
      background: #1e293b;
      border-radius: 12px;
      margin: 1.5rem 0;
      overflow: hidden;
      border: 1px solid #334155;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #fbbf24, #f59e0b);
      width: 0%;
      transition: width 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: bold;
      font-size: 0.75rem;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: #1e293b;
      padding: 1rem;
      border-radius: 8px;
      text-align: center;
      border: 1px solid #334155;
    }
    .stat-value {
      font-size: 1.5rem;
      font-weight: bold;
      color: #fbbf24;
      font-family: monospace;
    }
    .stat-label {
      font-size: 0.75rem;
      color: #94a3b8;
      text-transform: uppercase;
      margin-top: 0.25rem;
    }
    .status {
      text-align: center;
      margin-top: 1rem;
      font-weight: 500;
      color: #fbbf24;
    }
    .pack-description {
      font-size: 0.875rem;
      color: #94a3b8;
      margin-top: 0.5rem;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Lullaby Extended Training</h1>

    <div class="form-group">
      <label>Target Name</label>
      <input type="text" id="modelName" value="Emma" />
    </div>

    <div class="form-group">
      <label>Persona Pack</label>
      <select id="personaPack" onchange="updatePackInfo()">
        <option value="companion" selected>Companion (Warm, Empathetic, Supportive)</option>
        <option value="mentor">Mentor (Wise, Direct, Guiding)</option>
        <option value="creative">Creative (Imaginative, Playful, Unpredictable)</option>
        <option value="stoic">Stoic (Calm, Grounded, Resilient)</option>
      </select>
      <div id="packDescription" class="pack-description">Warm, empathetic, supportive - built for connection</div>
    </div>

    <div class="form-group">
      <label>Training Intensity (Duration)</label>
      <select id="personalityIntensity">
        <option value="light">Light (~5 mins, 1 epoch)</option>
        <option value="medium" selected>Medium (~15 mins, 3 epochs) - Recommended</option>
        <option value="strong">Strong (~25 mins, 5 epochs)</option>
      </select>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-value" id="samplesProcessed">0</div>
        <div class="stat-label">Samples Processed</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="trainingLoss">-</div>
        <div class="stat-label">Avg Loss</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="timeElapsed">0s</div>
        <div class="stat-label">Time Elapsed</div>
      </div>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" id="progressBar">0%</div>
    </div>

    <div style="text-align: center;">
      <button class="btn" id="startBtn" onclick="startTraining()">Start Training</button>
      <button class="btn" id="stopBtn" onclick="stopTraining()" disabled>Stop Training</button>
      <button class="btn" id="saveBtn" onclick="saveCheckpoint()" disabled>Save Checkpoint</button>
    </div>

    <div class="status" id="status">
      Ready to begin training. Click "Start Training" to proceed.
    </div>

    <div class="log" id="log"></div>
  </div>

  <script type="module">
    let worker = null;
    let trainingActive = false;
    let startTime = null;
    let totalLoss = 0;
    let lossCount = 0;
    let manifestData = null;
    
    // Training queue state
    let samplesQueue = [];
    let currentSampleIndex = 0;
    let totalSamplesToProcess = 0;
    let currentEpoch = 0;
    let totalProcessedCounter = 0;
    let totalEpochs = 0;

    // Training profile configuration
    const DEFAULT_PROFILE_KEY = 'latest';
    const CHECKPOINT_PROFILE_KEY = (() => {
      try {
        const stored = localStorage.getItem('lullaby.profileKey');
        const trimmed = stored ? stored.trim() : '';
        return trimmed || DEFAULT_PROFILE_KEY;
      } catch (err) {
        return DEFAULT_PROFILE_KEY;
      }
    })();

    const PERSONA_PACKS = {
      companion: {
        name: 'Companion',
        description: 'Warm, empathetic, supportive - built for connection',
        templates: [
          "Hi! I'm {name}. I'm so glad to be here with you.",
          "I'm {name}, and I want to understand how you feel.",
          "It's {name}. You're safe here.",
          "I'm {name}. Let's figure this out together.",
          "Hello! {name} here. I've got your back."
        ]
      },
      mentor: {
        name: 'Mentor',
        description: 'Wise, direct, guiding - built for growth',
        templates: [
          "I am {name}. Let's focus on what matters.",
          "I'm {name}. What did you learn from that?",
          "This is {name}. Keep pushing forward.",
          "I'm {name}. The answer is within you.",
          "{name} speaking. Focus on the next step."
        ]
      },
      creative: {
        name: 'Creative',
        description: 'Imaginative, playful, unpredictable - built for ideas',
        templates: [
          "I'm {name}! Let's make something weird.",
          "Hi! {name} here. What if we looked at it upside down?",
          "I'm {name}, and I love exploring new ideas!",
          "Hey! I'm {name}. Ready to get creative?",
          "I'm {name}. There's no wrong answer here."
        ]
      },
      stoic: {
        name: 'Stoic',
        description: 'Calm, grounded, resilient - steady presence',
        templates: [
          "I'm {name}. I'm here, steady as always.",
          "I'm {name}. Let's face this calmly together.",
          "Hi, I'm {name}. Take a breath. We have time.",
          "I'm {name}. Whatever comes, we'll handle it.",
          "I'm {name}. Stillness has its own strength."
        ]
      }
    };

    // Training config
    const TRAINING_CONFIG = {
      minSampleLength: 5,      // Skip very short samples
      maxSampleLength: 200,    // Truncate long samples
    };

    // Update pack info display
    window.updatePackInfo = function() {
      const packId = document.getElementById('personaPack').value;
      const pack = PERSONA_PACKS[packId];
      document.getElementById('packDescription').textContent = pack.description;
    };

    // Load training samples from manifest
    async function loadTrainingSamples() {
      try {
        const response = await fetch('./training-manifest.json');
        manifestData = await response.json();
        log(`Loaded ${manifestData.samples.length} samples from manifest`, 'success');
        return manifestData.samples;
      } catch (err) {
        log(`Failed to load manifest, using fallback: ${err.message}`, 'warn');
        return getFallbackSamples();
      }
    }

    // Fallback samples if manifest fails to load
    function getFallbackSamples() {
      return [
        "Hi! I'm here to chat with you.",
        "Hey there! How are you doing today?",
        "I'm really glad you're here.",
        "I'm here to listen and help however I can.",
        "I really appreciate you sharing that with me.",
        "That sounds really interesting. Tell me more!",
        "I'm here to listen, no judgment.",
        "I understand. That must be difficult.",
        "You're not alone in this.",
        "I believe in you.",
        "Your feelings are completely valid.",
        "It's okay to feel that way.",
        "Everything will be okay.",
        "I'm right here with you.",
        "The sun is warm and the sky is blue.",
        "I think that you are very kind.",
        "It was a good day today.",
        "I like it when you smile.",
        "How are you feeling right now?",
        "I want to help you with that.",
      ];
    }

    function log(message, type = 'info') {
      const logEl = document.getElementById('log');
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      const timestamp = new Date().toLocaleTimeString();
      entry.textContent = `[${timestamp}] ${message}`;
      logEl.appendChild(entry);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function updateStatus(message) {
      document.getElementById('status').textContent = message;
    }

    function updateProgress(current, total) {
      if (total === 0) return;
      const percent = Math.round((current / total) * 100);
      const progressBar = document.getElementById('progressBar');
      progressBar.style.width = `${percent}%`;
      progressBar.textContent = `${percent}%`;
    }

    function updateStats(samplesProcessed, avgLoss, timeElapsed) {
      document.getElementById('samplesProcessed').textContent = samplesProcessed;
      document.getElementById('trainingLoss').textContent = avgLoss !== null ? avgLoss.toFixed(4) : '-';
      document.getElementById('timeElapsed').textContent = `${timeElapsed}s`;
    }

    function initWorker() {
      if (!worker) {
        worker = new Worker(new URL('../lullaby.worker.js', import.meta.url), { type: 'module' });

        worker.onmessage = function(e) {
          const { type, payload } = e.data;

          if (type === 'INIT_COMPLETE') {
            log(`Engine worker initialized`, 'success');
            document.getElementById('startBtn').disabled = false;
          }
          else if (type === 'SEED_COMPLETE') {
            log(`Seeding complete. Ready to begin training.`, 'success');
            if (trainingActive) {
                log(`Starting Epoch 1/${totalEpochs}`, 'info');
                processNextSample();
            }
          }
          else if (type === 'TRAIN_COMPLETE') {
            if (!trainingActive) return;

            if (isFinite(payload.loss) && !isNaN(payload.loss)) {
              totalLoss += payload.loss;
              lossCount++;
            }

            const avgLoss = lossCount > 0 ? totalLoss / lossCount : 0;
            const elapsed = Math.round((Date.now() - startTime) / 1000);
            totalProcessedCounter++;
            updateStats(totalProcessedCounter, avgLoss, elapsed);
            updateProgress(totalProcessedCounter, totalSamplesToProcess);

            // Advance to next sample
            currentSampleIndex++;
            processNextSample();
          }
          else if (type === 'SAVE_COMPLETE') {
            log('✅ Checkpoint saved to IndexedDB.', 'success');
            updateStatus('Model checkpoint saved!');
          }
          else if (type === 'WORKER_ERROR') {
            log(`Worker error: ${payload.message}`, 'error');
            trainingActive = false;
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
          }
        };

        worker.onerror = function(err) {
          log(`Worker critical error: ${err.message}`, 'error');
        };

        // Initialize
        worker.postMessage({
          type: 'INIT',
          payload: { profileKey: CHECKPOINT_PROFILE_KEY, persistenceEnabled: true }
        });
      }
    }

    function processNextSample() {
      if (!trainingActive) return;

      if (currentSampleIndex >= samplesQueue.length) {
        // Finished current queue (which is one epoch or all epochs depending on how we structured it)
        log(`Epoch ${currentEpoch + 1} complete. Saving checkpoint...`, 'info');
        worker.postMessage({ type: 'SAVE', payload: null });

        currentEpoch++;
        if (currentEpoch < totalEpochs) {
          // Reset for next epoch
          samplesQueue = [...manifestData].sort(() => Math.random() - 0.5).slice(0, samplesQueue.length);
          currentSampleIndex = 0;
          log(`Starting Epoch ${currentEpoch + 1}/${totalEpochs}`, 'info');

          setTimeout(processNextSample, 500); // Short rest between epochs
        } else {
          // Fully complete
          trainingActive = false;
          const avgLoss = lossCount > 0 ? (totalLoss / lossCount).toFixed(4) : 'N/A';
          log(`Training fully completed! Avg loss: ${avgLoss}`, 'success');
          updateStatus('Training complete and saved! Your model is ready to use.');
          document.getElementById('startBtn').disabled = false;
          document.getElementById('stopBtn').disabled = true;
          document.getElementById('saveBtn').disabled = false;
        }
        return;
      }

      let sample = samplesQueue[currentSampleIndex];

      // Skip samples that are too short
      if (sample.length < TRAINING_CONFIG.minSampleLength) {
        currentSampleIndex++;
        processNextSample();
        return;
      }

      // Truncate samples that are too long
      if (sample.length > TRAINING_CONFIG.maxSampleLength) {
        sample = sample.slice(0, TRAINING_CONFIG.maxSampleLength);
      }

      worker.postMessage({
        type: 'TRAIN',
        payload: {
          text: sample,
          epoch: currentEpoch,
          totalEpochs: totalEpochs,
          isGameplay: false
        }
      });
    }

    window.startTraining = async function() {
      if (trainingActive) return;
      if (!worker) {
        log('Worker not initialized', 'error');
        return;
      }

      document.getElementById('startBtn').disabled = true;
      document.getElementById('stopBtn').disabled = false;
      document.getElementById('saveBtn').disabled = true;

      try {
        // Load samples from manifest
        const allSamples = await loadTrainingSamples();
        manifestData = allSamples;

        const intensity = document.getElementById('personalityIntensity').value;

        // Adjust training based on intensity
        totalEpochs = intensity === 'light' ? 1 : intensity === 'medium' ? 3 : 5;
        const samplesPerEpoch = intensity === 'light' ? 50 : intensity === 'medium' ? 100 : 150;

        log(`Starting training: ${totalEpochs} epoch(s), ${samplesPerEpoch} samples/epoch`, 'info');
        updateStatus('Training in progress...');

        trainingActive = true;
        startTime = Date.now();
        totalLoss = 0;
        lossCount = 0;
        currentEpoch = 0;
        currentSampleIndex = 0;
        totalSamplesToProcess = totalEpochs * samplesPerEpoch;
        totalProcessedCounter = 0;

        // Prepare queue for first epoch
        samplesQueue = [...allSamples].sort(() => Math.random() - 0.5).slice(0, samplesPerEpoch);

        const modelName = document.getElementById('modelName').value;
        const packId = document.getElementById('personaPack').value;
        const pack = PERSONA_PACKS[packId];

        log(`Seeding model "${modelName}" with ${pack.name} persona`, 'info');
        worker.postMessage({
          type: 'SEED',
          payload: {
            name: modelName,
            count: 30,
            templates: pack.templates
          }
        });
        // We defer processNextSample() to SEED_COMPLETE event.

      } catch (err) {
        log(`Training initialization error: ${err.message}`, 'error');
        updateStatus('Training failed to start.');
        document.getElementById('startBtn').disabled = false;
        document.getElementById('stopBtn').disabled = true;
      }
    };

    window.stopTraining = function() {
      if (!trainingActive) return;
      log('Stopping training...', 'warn');
      trainingActive = false;
      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
      document.getElementById('saveBtn').disabled = false;
    };

    window.saveCheckpoint = function() {
      if (!worker) {
        log('No worker to save', 'error');
        return;
      }
      log('Saving checkpoint...', 'info');
      updateStatus('Saving checkpoint...');
      worker.postMessage({ type: 'SAVE', payload: null });
    };

    // Initialize UI and worker
    log('Training interface ready', 'success');
    log(`Checkpoint profile: ${CHECKPOINT_PROFILE_KEY}`, 'info');
    document.getElementById('startBtn').disabled = true; // Disabled until worker init completes
    initWorker();

  </script>
</body>
</html>
